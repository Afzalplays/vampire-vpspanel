name: Build validation
on:
  push:
    branches: ["main", "feat/production-install-foundation"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - run: npm run build
        env:
          SESSION_SECRET: "ci-only-secret-not-for-deployment-0123456789abcdef"
